# Production Profile Configuration
# Hardened enterprise banking profile

# Strict Database Configuration (Supplied via environment secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console Strictly Disabled in Production
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Production JPA & Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Security & Compliance
smartbank.security.demo-codes-enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
