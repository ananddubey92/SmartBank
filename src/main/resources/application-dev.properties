# Development Profile Configuration
# Safe local development environment with H2 file database and local console

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Safe dev binding (local access only, prevent public exposure)
spring.h2.console.settings.web-allow-others=false

spring.jpa.show-sql=true
smartbank.security.demo-codes-enabled=true
