spring.application.name=onlinebankingsystem

# Profiles: default to 'dev' profile
spring.profiles.active=dev

# Common Datasource Defaults (Environment-overridable)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bankdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Security & Secrets Configuration
jwt.secret=${JWT_SECRET:onlinebankingsystemsecretkey256bitormore_securekey!!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
smartbank.security.demo-codes-enabled=${DEMO_CODES_ENABLED:true}
smartbank.security.cvv-secret-key=${CVV_SECRET_KEY:SmartBankSecr3tK3yForCvvEnc2026!}

# ML Fraud Microservice URL
smartbank.ml.service.url=${ML_SERVICE_URL:http://localhost:5001}